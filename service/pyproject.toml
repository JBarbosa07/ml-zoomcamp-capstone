[project]
name = "fish-cnn"
version = "0.1.0"
description = "CNN trained from scratch for fish species classification"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "tf2onnx>=1.16.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "onnxruntime>=1.23.2",
    "keras-image-helper>=0.0.2",
]
